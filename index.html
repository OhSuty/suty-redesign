<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Suty — Premium FiveM Scripts</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --bg:#000000;
    --surface:#0a0a0a;
    --surface-2:#111111;
    --border:#1a1a1a;
    --border-2:#222222;
    --fg:#ffffff;
    --fg-muted:#888888;
    --fg-dim:#5a5a5a;
    --accent:#991b1b;
    --accent-hover:#b91c1c;
    --accent-glow: rgba(153, 27, 27, 0.25);
    --accent-glow-strong: rgba(153, 27, 27, 0.5);
    --glow: 0 0 24px rgba(153, 27, 27, 0.25);
    --glow-strong: 0 0 32px rgba(153, 27, 27, 0.5);
  }
  *{ -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  html{ scroll-behavior: smooth; }
  html, body{
    background:var(--bg);
    color:var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-feature-settings:"ss01","cv11";
  }
  body{ overflow-x:hidden; }
  ::selection{ background:var(--accent); color:#fff; }

  /* Custom scrollbar */
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:#000; }
  ::-webkit-scrollbar-thumb{ background:#1a1a1a; border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover{ background:#2a2a2a; }

  /* Grid bg */
  .grid-bg{
    background-image:
      linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 56px 56px;
    background-position: center top;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 80%);
  }
  .dot-bg{
    background-image: radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 22px 22px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 20%, transparent 75%);
  }

  /* Red spotlight */
  .spotlight{
    background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(153,27,27,0.22), rgba(153,27,27,0.05) 40%, transparent 70%);
  }
  .spotlight-soft{
    background: radial-gradient(ellipse 50% 40% at 50% 0%, rgba(153,27,27,0.14), transparent 60%);
  }

  /* Italic accent + shine */
  .italic-accent{
    font-style: italic;
    color: var(--accent-hover);
    display: inline-block;
    padding-right: 0.12em;
    position: relative;
  }
  .shine{
    background: linear-gradient(110deg,
      var(--accent-hover) 0%,
      var(--accent-hover) 35%,
      #fca5a5 50%,
      var(--accent-hover) 65%,
      var(--accent-hover) 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
  }
  @keyframes shine{
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Hero staged entry — translate + scale + blur sharpen (matches suty.dev) */
  .hero-step-0,.hero-step-1,.hero-step-2,.hero-step-3,.hero-step-4{
    opacity:0;
    transform: translateY(28px) scale(0.96);
    filter: blur(8px);
    transition:
      opacity   900ms cubic-bezier(.16,1,.3,1),
      transform 900ms cubic-bezier(.16,1,.3,1),
      filter    900ms cubic-bezier(.16,1,.3,1);
    will-change: opacity, transform, filter;
  }
  .hero-on .hero-step-0{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); transition-delay: 100ms; }
  .hero-on .hero-step-1{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); transition-delay: 250ms; }
  .hero-on .hero-step-2{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); transition-delay: 450ms; }
  .hero-on .hero-step-3{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); transition-delay: 650ms; }
  .hero-on .hero-step-4{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); transition-delay: 850ms; }

  /* Reveal on scroll — dramatic pop with blur sharpen (matches suty.dev) */
  .reveal{
    opacity:0;
    transform: translateY(48px) scale(0.92);
    filter: blur(10px);
    transition:
      opacity   900ms cubic-bezier(.16,1,.3,1),
      transform 900ms cubic-bezier(.16,1,.3,1),
      filter    900ms cubic-bezier(.16,1,.3,1);
    will-change: opacity, transform, filter;
  }
  .reveal.is-visible{ opacity:1; transform: translateY(0) scale(1); filter: blur(0); }

  /* Page transition — soft fade-up when switching nav tabs */
  @keyframes page-fade-in{
    from { opacity: 0; transform: translateY(8px); filter: blur(4px); }
    to   { opacity: 1; transform: translateY(0);  filter: blur(0); }
  }
  .page-transition{ animation: page-fade-in 380ms cubic-bezier(.16,1,.3,1) both; }

  /* Respect motion preference */
  @media (prefers-reduced-motion: reduce){
    .hero-step-0,.hero-step-1,.hero-step-2,.hero-step-3,.hero-step-4,
    .hero-on .hero-step-0,.hero-on .hero-step-1,.hero-on .hero-step-2,.hero-on .hero-step-3,.hero-on .hero-step-4,
    .reveal,.reveal.is-visible,
    .page-transition,.deck-card{
      animation: none !important;
      transition: none !important;
      opacity: 1 !important;
      transform: none !important;
      filter: none !important;
    }
  }

  /* Cards */
  .card-lift{
    transition: transform 320ms cubic-bezier(.16,1,.3,1), border-color 320ms ease, box-shadow 320ms ease, background-color 320ms ease;
  }
  .card-lift:hover{
    transform: translateY(-4px) scale(1.015);
    border-color: rgba(153,27,27,0.55);
    box-shadow: 0 0 0 1px rgba(153,27,27,0.15), var(--glow);
  }

  /* Buttons */
  .btn-primary{
    background: var(--accent);
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -1px 0 rgba(0,0,0,0.25);
    transition: background 200ms ease, box-shadow 250ms ease, transform 150ms ease;
  }
  .btn-primary:hover{
    background: var(--accent-hover);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(0,0,0,0.25), var(--glow-strong);
  }
  .btn-primary:active{ transform: translateY(1px); }
  .btn-primary:focus-visible{ outline: 2px solid #fca5a5; outline-offset:2px; }

  .btn-ghost{
    background: transparent;
    color: #fff;
    border:1px solid var(--border-2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    transition: border-color 200ms ease, background 200ms ease, color 200ms ease;
  }
  .btn-ghost:hover{
    border-color:#3a3a3a;
    background: rgba(255,255,255,0.03);
  }
  .btn-ghost:focus-visible{ outline: 2px solid #555; outline-offset:2px; }

  /* Pill nav */
  .pill-nav{
    background: rgba(15,15,15,0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border:1px solid var(--border);
  }
  .pill-link{
    transition: color 180ms ease, background 220ms ease, box-shadow 220ms ease;
    color: var(--fg-muted);
  }
  .pill-link:hover{ color:#fff; }
  .pill-link.active{
    background: var(--accent);
    color:#fff;
    box-shadow: 0 0 18px rgba(153,27,27,0.55), inset 0 1px 0 rgba(255,255,255,0.18);
  }

  /* Pulsing dot */
  .pulse-dot{
    position: relative;
  }
  .pulse-dot::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:9999px;
    background: var(--accent-hover);
    opacity:0.6;
    animation: pulse 2.2s ease-out infinite;
  }
  @keyframes pulse{
    0%   { transform: scale(1); opacity: 0.7; }
    80%  { transform: scale(2.6); opacity: 0; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  /* Cart bump */
  @keyframes cart-bump{
    0% { transform: scale(1); }
    40% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .cart-bump{ animation: cart-bump 320ms cubic-bezier(.16,1,.3,1); }

  /* Skeleton */
  @keyframes shimmer{
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .skeleton{
    background: linear-gradient(90deg, #0e0e0e 0%, #161616 40%, #0e0e0e 80%);
    background-size: 800px 100%;
    animation: shimmer 1.6s linear infinite;
  }

  /* Image hover scale wrapper */
  .img-zoom{ transition: transform 700ms cubic-bezier(.16,1,.3,1); }
  .card-lift:hover .img-zoom{ transform: scale(1.06); }

  /* Underline-on-hover for links */
  .hover-underline{
    position: relative;
  }
  .hover-underline::after{
    content:"";
    position:absolute; left:0; bottom:-2px;
    width:100%; height:1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right center;
    transition: transform 300ms cubic-bezier(.16,1,.3,1);
  }
  .hover-underline:hover::after{
    transform: scaleX(1);
    transform-origin: left center;
  }

  /* Accordion */
  details.faq summary{ list-style:none; cursor:pointer; }
  details.faq summary::-webkit-details-marker{ display:none; }
  details.faq[open] .faq-chev{ transform: rotate(45deg); }
  .faq-chev{ transition: transform 280ms cubic-bezier(.16,1,.3,1); }

  /* Avatar gradient circles — keep crisp at small sizes */
  .avatar{
    background-image: var(--avatar-grad);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  }

  /* Section dividers */
  .hr-fade{
    background: linear-gradient(90deg, transparent, var(--border-2) 30%, var(--border-2) 70%, transparent);
    height:1px;
  }

  /* Image fallback gradient */
  .img-fallback{ background: linear-gradient(135deg, #1a0510 0%, #000 75%); }

  /* Marquee-ish framework hover */
  .framework-pill{
    transition: border-color 250ms ease, background 250ms ease, transform 250ms ease, color 250ms ease;
  }
  .framework-pill:hover{
    border-color:#3a3a3a;
    background: #0f0f0f;
    transform: translateY(-2px);
  }
  .framework-pill.active{
    border-color: rgba(153,27,27,0.6);
    background: rgba(153,27,27,0.08);
    color:#fff;
    box-shadow: var(--glow);
  }

  /* Code block */
  pre.code{
    background:#070707;
    border:1px solid var(--border);
    border-radius:10px;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:13px;
    line-height:1.65;
    color:#d4d4d4;
    overflow-x:auto;
  }
  .tok-k{ color:#fca5a5; }
  .tok-s{ color:#86efac; }
  .tok-n{ color:#93c5fd; }
  .tok-c{ color:#525252; font-style:italic; }
  .tok-f{ color:#fde68a; }

  /* Hint box */
  .hint-info{
    border:1px solid rgba(59,130,246,0.25);
    background: linear-gradient(180deg, rgba(59,130,246,0.06), rgba(59,130,246,0.02));
    border-radius:10px;
  }

  /* Docs sidebar caret */
  .caret{ transition: transform 220ms cubic-bezier(.16,1,.3,1); }
  details[open] > summary .caret{ transform: rotate(90deg); }

  /* Subtle inner highlight on cards */
  .card{
    background: var(--surface);
    border:1px solid var(--border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.025);
  }

  /* Tabs underline */
  .tab-btn{ transition: color 200ms ease, border-color 200ms ease; }
  .tab-btn.active{ color:#fff; border-color: var(--accent-hover); }

  /* Marquee for ticker */
  @keyframes ticker{
    0%{ transform: translateX(0); }
    100%{ transform: translateX(-50%); }
  }
  .ticker{ animation: ticker 40s linear infinite; }

  /* Focus rings */
  a:focus-visible, button:focus-visible{ outline-offset: 2px; }

  /* Section snap (nice-to-have, gentle) */
  .snap-y{ scroll-behavior: smooth; }

  /* Subtle noise overlay (CSS only) */
  .noise::before{
    content:"";
    position:absolute; inset:0; pointer-events:none;
    background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode: overlay;
    opacity: 0.35;
  }

  /* prevent layout shift in icons */
  svg{ flex-shrink:0; }

  /* Showcase deck — cinematic crossfade with blur sharpen (matches suty.dev) */
  @keyframes deck-fade-in{
    from { opacity: 0; transform: translateY(16px) scale(0.94); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0)   scale(1);    filter: blur(0); }
  }
  .deck-card{
    animation: deck-fade-in 550ms cubic-bezier(.16,1,.3,1);
    will-change: opacity, transform, filter;
  }

  /* 3D rotated side cards for the showcase deck */
  .rotate-y-15  { transform: rotateY(15deg)  translateX(8px)  translateY(-8px); transform-origin: right center; }
  .-rotate-y-15 { transform: rotateY(-15deg) translateX(-8px) translateY(-8px); transform-origin: left center; }
  @media (min-width: 640px){
    .sm\:rotate-y-15  { transform: rotateY(20deg)  translateX(8px)  translateY(-8px); transform-origin: right center; }
    .sm\:-rotate-y-15 { transform: rotateY(-20deg) translateX(-8px) translateY(-8px); transform-origin: left center; }
  }
  .stage-deck{ transform-style: preserve-3d; }
  .stage-card{ backface-visibility: hidden; }
</style>
</head>
<body class="bg-black text-white">
<div id="root"></div>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="tebex.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="product.jsx"></script>
<script type="text/babel" src="docs.jsx"></script>
<script type="text/babel" src="pages.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
